<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Micro diagram builder</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", Arial, sans-serif;
      background: #f6f8fb;
      color: #0f2a4a;
      line-height: 1.45;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 20px 20px 72px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    .meta { color: #4b5d73; font-size: 0.92rem; margin: 0 0 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Micro diagram builder</h1>
    <p class="meta">Development page. Draw freely and pick an axis pair in the builder.</p>
    <div id="board"></div>
  </div>
  <script src="micro-diagram-builder.js?v=20261101shapeswitch"></script>
  <script>
    MicroDiagramBuilder.mount(document.getElementById("board"), { points: true, showAllAxes: true });
  </script>
</body>
</html>
